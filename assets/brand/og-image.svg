<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="foxai · Address Generator">
  <!--
    Open Graph image (1200×630). Used as og:image + twitter:image.
    SVG keeps the file under 5 KB and renders crisp on any device.
    Reference this file from every HTML page's <head> as
        https://c.qifei2035.eu.cc/assets/brand/og-image.svg
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9D6"/>
      <stop offset="50%" stop-color="#FFD7B3"/>
      <stop offset="100%" stop-color="#FFB987"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2571F"/>
      <stop offset="100%" stop-color="#B9461A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#FF7A4D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF7A4D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid texture -->
  <g stroke="#E2571F" stroke-opacity="0.06">
    <path d="M0 200 L1200 200 M0 400 L1200 400"/>
    <path d="M300 0 L300 630 M600 0 L600 630 M900 0 L900 630"/>
  </g>

  <!-- foxai tile (mark on rounded square) -->
  <g transform="translate(140, 175)">
    <rect width="280" height="280" rx="62" fill="url(#tile)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"
       transform="translate(100, 100) scale(2.6)">
      <path d="M23 55V22c0-7.2 5.8-13 13-13h2"/>
      <path d="M12.5 31h21"/>
    </g>
    <circle cx="276" cy="34" r="20" fill="#FFFFFF"/>
  </g>

  <!-- wordmark + tagline -->
  <g transform="translate(490, 250)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="96" font-weight="800" letter-spacing="-0.02em" fill="#1a1a1a">fox<tspan fill="#E2571F">ai</tspan></text>
    <text x="2" y="62" font-size="40" font-weight="600" letter-spacing="-0.01em" fill="#1a1a1a">Address Generator</text>
    <text x="2" y="120" font-size="24" font-weight="500" fill="#5a4a3e">Generate realistic addresses in 6 countries · Free forever · No registration</text>
  </g>

  <!-- country chips at the bottom -->
  <g transform="translate(140, 510)" font-family="ui-sans-serif, sans-serif" font-size="20" font-weight="600">
    <g>
      <rect x="0" y="0" width="120" height="50" rx="25" fill="#FFFFFF" stroke="#E2571F" stroke-opacity="0.25"/>
      <text x="60" y="32" text-anchor="middle" fill="#1a1a1a">🇺🇸 USA</text>
    </g>
    <g transform="translate(135, 0)">
      <rect x="0" y="0" width="120" height="50" rx="25" fill="#FFFFFF" stroke="#E2571F" stroke-opacity="0.25"/>
      <text x="60" y="32" text-anchor="middle" fill="#1a1a1a">🇨🇦 CA</text>
    </g>
    <g transform="translate(270, 0)">
      <rect x="0" y="0" width="120" height="50" rx="25" fill="#FFFFFF" stroke="#E2571F" stroke-opacity="0.25"/>
      <text x="60" y="32" text-anchor="middle" fill="#1a1a1a">🇬🇧 UK</text>
    </g>
    <g transform="translate(405, 0)">
      <rect x="0" y="0" width="120" height="50" rx="25" fill="#FFFFFF" stroke="#E2571F" stroke-opacity="0.25"/>
      <text x="60" y="32" text-anchor="middle" fill="#1a1a1a">🇦🇺 AU</text>
    </g>
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="120" height="50" rx="25" fill="#FFFFFF" stroke="#E2571F" stroke-opacity="0.25"/>
      <text x="60" y="32" text-anchor="middle" fill="#1a1a1a">🇩🇪 DE</text>
    </g>
    <g transform="translate(675, 0)">
      <rect x="0" y="0" width="120" height="50" rx="25" fill="#FFFFFF" stroke="#E2571F" stroke-opacity="0.25"/>
      <text x="60" y="32" text-anchor="middle" fill="#1a1a1a">🇫🇷 FR</text>
    </g>
  </g>

  <!-- domain footer -->
  <text x="1140" y="595" text-anchor="end" font-family="ui-monospace, monospace" font-size="18" fill="#5a4a3e">c.qifei2035.eu.cc</text>
</svg>
